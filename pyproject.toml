[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lamportlens"
version = "1.0.0"
description = "Rent-exempt and balance hygiene auditor for captured Solana account snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the lamportlens authors" }]
keywords = ["solana", "rent", "lamports", "accounts", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
