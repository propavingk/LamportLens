<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-labelledby="ll-banner-title ll-banner-desc">
  <!-- palette: mint paper and pine ink; slate for secondary text; one copper accent on the live SIMD-0437 step. contrast against #F2F7F3: pine #1C3A2E 11.4:1, slate #5F6F66 4.9:1, copper #8F6B12 4.5:1. motion: a marker steps down the six rates in order, encoding the SIMD-0437 schedule; with reduced motion the marker sits on the live step and the banner still reads. every number is exact arithmetic on the documented formula: (128 + 0) * rate. -->
  <title id="ll-banner-title">lamportlens banner: the SIMD-0437 rate ladder</title>
  <desc id="ll-banner-desc">Six bars, one per lamports-per-byte step from 6,960 down to 696, showing the rent-exempt minimum for a zero-byte account at each step. The 6,333 bar is copper because that step is live on mainnet. A marker steps down the ladder in order.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #ll-marker { animation: ll-step 6s steps(5) infinite; }
    }
    @keyframes ll-step {
      from { transform: translateX(-80px); }
      to { transform: translateX(320px); }
    }
  </style>
  <rect width="640" height="176" fill="#F2F7F3"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <text x="16" y="56" fill="#1C3A2E">lamport</text>
    <text x="108" y="56" fill="#5F6F66">lens</text>
  </g>
  <text x="16" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6F66">the SIMD-0437 ladder</text>

  <g fill="#1C3A2E">
    <rect x="156" y="40" width="40" height="72"/>
    <rect x="316" y="60" width="40" height="52"/>
    <rect x="396" y="84" width="40" height="28"/>
    <rect x="476" y="96" width="40" height="16"/>
    <rect x="556" y="104" width="40" height="8"/>
  </g>
  <rect x="236" y="48" width="40" height="64" fill="#8F6B12"/>

  <line x1="176" y1="112" x2="576" y2="112" stroke="#1C3A2E" stroke-width="1.5"/>

  <g font-family='"Cascadia Mono", "JetBrains Mono", Consolas, monospace' font-size="11" fill="#1C3A2E">
    <text x="176" y="128" text-anchor="middle">6960</text>
    <text x="256" y="128" text-anchor="middle">6333</text>
    <text x="336" y="128" text-anchor="middle">5080</text>
    <text x="416" y="128" text-anchor="middle">2575</text>
    <text x="496" y="128" text-anchor="middle">1322</text>
    <text x="576" y="128" text-anchor="middle">696</text>
  </g>
  <text x="256" y="144" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8F6B12">live on mainnet</text>

  <g font-family='"Cascadia Mono", "JetBrains Mono", Consolas, monospace' font-size="11" fill="#1C3A2E">
