<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="ll-banner-title ll-banner-desc">
  <!-- palette: mint paper and pine ink; slate for secondary text; one copper accent on the live SIMD-0437 step. contrast against #F2F7F3: pine #1C3A2E 11.4:1, slate #5F6F66 4.9:1, copper #8F6B12 4.5:1. motion: a marker steps down the six rates in order, encoding the SIMD-0437 schedule; the marker sits below the labels so it never covers them, and with reduced motion it rests on the live step. every number is exact arithmetic on the documented formula: (128 + 0) * rate. -->
  <title id="ll-banner-title">lamportlens banner: the SIMD-0437 rate ladder</title>
  <desc id="ll-banner-desc">Six bars, one per lamports-per-byte step from 6,960 down to 696, showing the rent-exempt minimum for a zero-byte account at each step. The 6,333 bar is copper because that step is live on mainnet. A marker steps down the ladder beneath the rate labels.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #ll-marker { animation: ll-step 6s steps(5) infinite; }
    }
    @keyframes ll-step {
      from { transform: translateX(-80px); }
      to { transform: translateX(320px); }
    }
  </style>
  <rect width="640" height="200" fill="#F2F7F3"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <text x="16" y="56" fill="#1C3A2E">lamport</text>
    <text x="108" y="56" fill="#5F6F66">lens</text>
  </g>
  <text x="16" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6F66">the SIMD-0437 ladder</text>

  <g fill="#1C3A2E">
    <rect x="164" y="40" width="40" height="72"/>
    <rect x="324" y="60" width="40" height="52"/>
    <rect x="404" y="84" width="40" height="28"/>
    <rect x="484" y="96" width="40" height="16"/>
    <rect x="564" y="104" width="40" height="8"/>
  </g>
  <rect x="244" y="48" width="40" height="64" fill="#8F6B12"/>

  <line x1="184" y1="112" x2="584" y2="112" stroke="#1C3A2E" stroke-width="1.5"/>

  <g font-family='"Cascadia Mono", "JetBrains Mono", Consolas, monospace' font-size="11" fill="#1C3A2E">
    <text x="184" y="128" text-anchor="middle">6960</text>
    <text x="264" y="128" text-anchor="middle">6333</text>
    <text x="344" y="128" text-anchor="middle">5080</text>
    <text x="424" y="128" text-anchor="middle">2575</text>
    <text x="504" y="128" text-anchor="middle">1322</text>
    <text x="584" y="128" text-anchor="middle">696</text>
  </g>

  <g id="ll-marker">
    <path d="M256 142 L272 142 L264 134 Z" fill="#1C3A2E"/>
  </g>

  <text x="264" y="164" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8F6B12">live on mainnet</text>

  <g font-family='"Cascadia Mono", "JetBrains Mono", Consolas, monospace' font-size="11" fill="#1C3A2E">
    <text x="184" y="32" text-anchor="middle">890880</text>
    <text x="584" y="96" text-anchor="middle">89088</text>
  </g>

  <text x="16" y="184" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6F66">bars: rent-exempt minimum for a zero-byte account at each step</text>
</svg>
