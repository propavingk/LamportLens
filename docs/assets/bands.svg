<svg xmlns="http://www.w3.org/2000/svg" width="640" height="184" viewBox="0 0 640 184" role="img" aria-labelledby="ll-bands-title ll-bands-desc">
  <!-- palette: mint paper and pine ink; one copper accent on the band that holds almost the whole storage bond. contrast against #F2F7F3: pine #1C3A2E 11.4:1, slate #5F6F66 4.9:1, copper #8F6B12 4.5:1. all numbers come from running the CLI on samples/snapshot.jsonl at 6,333 lamports per byte. -->
  <title id="ll-bands-title">Accounts and locked lamports per data band</title>
  <desc id="ll-bands-desc">Seven rows, one per data length band. Bars show the account count in each band; the two right columns show the count and the lamports held as exemptions. The 1M and above band, two accounts, holds 22,167,121,248 lamports and carries the copper accent. The 100-999 band holds 58,630,914 lamports across 26 accounts, and the 1k-9.9k band holds 125,545,392 across 8.</desc>
  <rect width="640" height="184" fill="#F2F7F3"/>
  <text x="16" y="26" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C3A2E">lamportlens: accounts and locked lamports by data band</text>

  <g font-family='"Cascadia Mono", "JetBrains Mono", Consolas, monospace' font-size="11" fill="#5F6F66">
    <text x="112" y="44">accounts</text>
    <text x="616" y="44" text-anchor="end">locked lamports</text>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1C3A2E">
    <text x="16" y="58">0 bytes</text>
    <text x="16" y="74">1-99</text>
    <text x="16" y="90">100-999</text>
    <text x="16" y="106">1k-9.9k</text>
    <text x="16" y="122">10k-99k</text>
    <text x="16" y="138">100k-999k</text>
    <text x="16" y="154">1M and above</text>
  </g>

  <g fill="#1C3A2E">
    <rect x="112" y="50" width="24" height="8"/>
    <rect x="112" y="66" width="24" height="8"/>
    <rect x="112" y="82" width="208" height="8"/>
    <rect x="112" y="98" width="64" height="8"/>
  </g>
  <rect x="112" y="146" width="16" height="8" fill="#8F6B12"/>

