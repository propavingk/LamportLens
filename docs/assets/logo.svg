<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-labelledby="ll-logo-title ll-logo-desc">
  <!-- palette: mint paper and pine ink from the storage-bond subject; slate for the lens half, so the accent budget stays free for the rate chart. contrast against #F2F7F3: pine #1C3A2E 11.4:1, slate #5F6F66 4.9:1. -->
  <title id="ll-logo-title">lamportlens wordmark</title>
  <desc id="ll-logo-desc">The name lamportlens set in a single weight, split at the compound boundary: lamport in pine, lens in slate, with a tagline underneath.</desc>
  <rect width="360" height="96" fill="#F2F7F3"/>
